name: "Echange moi si tu peux"
category: Web
description: |-
  Après le bannissement d'un collectionneur impliqué dans un trafic de cartes interdites, Cybermon Online a remplacé les échanges informels par un centre d'échange sécurisé. Les joueurs peuvent désormais publier un classeur, proposer des cartes et accompagner leurs demandes d'un message personnalisé.

  La plateforme affirme avoir retiré toutes les cartes du Projet Black Deck. Pourtant, son inventaire global comptabilise encore une carte interdite qui n'apparaît dans aucune collection. Si personne ne la possède, sa copie est probablement conservée directement sur le serveur.

  Format : `CYBN{...}`
