frontend vibecodé sans une once de respect il faut le dire

ducoup en guise de compensation : https://fr.wikipedia.org/wiki/X64 

alors là vraiment de rien c'est cadeau \ (^_^) /

-->

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloat less stack</title>
<style>
  :root {
    color-scheme: dark;
    --deep: #06131b;
    --ink: #dbe9ee;
    --ink-out: #c3d8df;
    --glow: #d6f3f0;
    --pane: rgba(7, 20, 29, .68);
    --pane-2: rgba(4, 13, 20, .84);
    --edge: rgba(200, 236, 240, .09);
    --lit: rgba(222, 248, 245, .55);
    --err: #ffa594;
    --gap: clamp(28px, 2.5vw, 48px);
  }
  * { box-sizing: border-box; scrollbar-width: thin;
      scrollbar-color: rgba(200, 236, 240, .18) transparent; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--deep); color: var(--ink);
         font: 13.5px/1.65 ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
  ::selection { background: rgba(190, 240, 236, .26); }

  /* ciel : image retournée pour que la trouée lumineuse tombe dans la fenêtre libre,
     débordement de 6 % pour masquer les bandes noires et laisser dériver */
  body::before {
    content: ""; position: fixed; inset: -6%; z-index: -2;
    background: var(--deep) url(/background.jpg) center / cover no-repeat;
    transform: scaleX(-1) scale(1) translate(0, 0);
    animation: drift 120s ease-in-out infinite alternate;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(120% 90% at 72% 18%, transparent 0 28%, rgba(3, 10, 15, .45) 72%, rgba(2, 7, 11, .88) 100%),
      linear-gradient(180deg, transparent 45%, rgba(3, 10, 15, .55) 100%);
  }
  @keyframes drift { to { transform: scaleX(-1) scale(1.07) translate(1.5%, -1%); } }

  /* composition : éditeur à gauche, à droite une boîte alignée en haut sur l'éditeur
     puis la sortie, qui descend plus bas que lui */
  main {
    height: 100vh; height: 100dvh;
    display: grid;
    grid-template-columns: 6vw minmax(0, 1fr) var(--gap) minmax(0, .9fr) 5vw;
    grid-template-rows: 7vh auto var(--gap) minmax(0, 1fr) 7vh 5vh;
  }
  .pane {
    position: relative; display: flex; min-height: 0;
    background: linear-gradient(165deg, var(--pane), var(--pane-2));
    -webkit-backdrop-filter: blur(16px) saturate(125%);
    backdrop-filter: blur(16px) saturate(125%);
    border: 1px solid var(--edge); border-radius: 3px;
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .75);
    transition: border-color .4s, box-shadow .4s;
  }
  /* liseré éclairé côté lumière */
  .pane::after {
    content: ""; position: absolute; inset: -1px; padding: 1px; border-radius: inherit;
    pointer-events: none; background: linear-gradient(var(--a), var(--lit), transparent 42%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    transition: opacity .4s;
  }
  .src { grid-column: 2; grid-row: 2 / 5; --a: 225deg; }
  .aux { grid-column: 4; grid-row: 2; --a: 170deg; padding: 12px; }
  .aux img { display: block; width: 100%; height: auto; max-height: 40vh;
             object-fit: cover; object-position: 50% 20%; border-radius: 2px; }
  .out { grid-column: 4; grid-row: 4 / 6; --a: 160deg; overflow: hidden; }
  .src:focus-within { border-color: rgba(200, 236, 240, .16); }

  textarea {
    flex: 1; width: 100%; min-height: 0; margin: 0; padding: 30px 32px 72px;
    border: 0; outline: none; resize: none; background: transparent;
    color: var(--ink); caret-color: var(--glow); font: inherit; tab-size: 4;
    white-space: pre; overflow: auto;
  }
  pre {
    flex: 1; min-height: 0; margin: 0; padding: 30px 32px; overflow: auto;
    white-space: pre-wrap; word-break: break-word; color: var(--ink-out);
  }
  #out:empty::before {
    content: ""; display: inline-block; width: .55em; height: 1.15em; vertical-align: -.2em;
    background: var(--glow); opacity: .5; animation: blink 1.1s steps(1) infinite;
  }

  /* bouton : onglet logé dans le coin bas droit de l'éditeur, flanc gauche en « / » */
  #run {
    --cut: 16px;
    grid-column: 2; grid-row: 4; align-self: end; justify-self: end;
    position: relative; z-index: 2; overflow: hidden;
    width: 108px; height: 42px; padding: 0; border: 0; border-radius: 0 0 3px 0;
    cursor: pointer; font: inherit; color: var(--glow);
    background-color: rgba(214, 243, 240, .14);
    clip-path: polygon(var(--cut) 0, 100% 0, 100% 100%, 0 100%);
    transition: background-color .25s, color .25s;
  }
  #run::before {
    content: ""; position: absolute; inset: 0; margin: auto; width: 10px; height: 12px;
    translate: calc(var(--cut) / 4 + 1px) 0; background: currentColor;
    clip-path: polygon(0 0, 100% 50%, 0 100%);
    transition: translate .25s cubic-bezier(.2, .8, .2, 1);
  }
  #run::after {
    content: ""; position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .5) 50%, transparent 70%)
      no-repeat; background-size: 60% 100%;
  }
  #run:not(:disabled):hover { background-color: var(--glow); color: var(--deep); }
  #run:not(:disabled):hover::before { translate: calc(var(--cut) / 4 + 4px) 0; }
  #run:not(:disabled):active { background-color: #fff; }
  #run:focus-visible { outline: none; background-color: rgba(214, 243, 240, .32); }
  #run:disabled { cursor: progress; background-color: rgba(214, 243, 240, .2); }
  #run:disabled::before {
    width: 12px; height: 12px; translate: calc(var(--cut) / 4) 0; clip-path: none;
    background: none; border: 1.5px solid currentColor; border-right-color: transparent;
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  #run:disabled::after { opacity: 1; animation: sweep 1.1s linear infinite; }

  /* états, sans texte : balayage pendant l'exécution, teinte corail en cas d'erreur */
  #st { position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap; }
  .out::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; z-index: 1;
    opacity: 0; background: linear-gradient(90deg, transparent, var(--glow), transparent)
      no-repeat; background-size: 40% 100%;
  }
  #run:disabled ~ .out::before { opacity: 1; animation: scan 1.1s linear infinite; }
  #st.err ~ .out { border-color: rgba(255, 165, 148, .22);
    box-shadow: 0 40px 90px -30px rgba(0, 0, 0, .75), 0 0 70px -24px rgba(255, 120, 100, .45); }
  #st.err ~ .out::after { --lit: rgba(255, 175, 158, .7); }
  #st.err ~ .out pre { color: var(--err); }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes spin { to { rotate: 1turn; } }
  @keyframes sweep { from { background-position: -150% 0; } to { background-position: 250% 0; } }
  @keyframes scan { from { background-position: -70% 0; } to { background-position: 170% 0; } }

  @media (max-width: 820px) {
    body { overflow: auto; }
    main { height: auto; min-height: 100dvh;
      grid-template-columns: 16px minmax(0, 1fr) 16px;
      grid-template-rows: 16px 62vh 16px minmax(38vh, auto) 16px auto 16px; }
    .src, #run { grid-column: 2; grid-row: 2; }
    .out { grid-column: 2; grid-row: 4; }
    .aux { grid-column: 2; grid-row: 6; }
    textarea, pre { padding: 22px 20px; }
    textarea { padding-bottom: 64px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after { animation-duration: .01ms !important;
                           animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<main>
  <section class="pane src">
    <textarea id="code" spellcheck="false" wrap="off" aria-label="source"></textarea>
  </section>
  <button id="run" aria-label="Exécuter" title="Ctrl + Entrée"></button>
  <small id="st" aria-live="polite"></small>
  <section class="pane aux" id="aux">
    <img src="/totoro.gif" alt="" decoding="async">
  </section>
  <section class="pane out">
    <pre id="out" aria-label="sortie"></pre>
  </section>
</main>
<script>
const STARTER = %STARTER%;
const code = document.getElementById('code');
const out  = document.getElementById('out');
const st   = document.getElementById('st');
const btn  = document.getElementById('run');
code.value = STARTER;
async function run(){
  btn.disabled = true; st.className=''; st.textContent = 'assemblage…'; out.textContent = '';
  try {
    const r = await fetch('/run', { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code: code.value }) });
    const j = await r.json();
    out.textContent = j.output || '(aucune sortie)';
    if (j.ok) { st.className=''; st.textContent=''; }
    else { st.className='err'; st.textContent = 'erreur : ' + j.stage; }
  } catch(e){ st.className='err'; st.textContent=''; out.textContent = 'Erreur réseau : ' + e; }
  btn.disabled = false;
}
btn.onclick = run;
code.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'Enter'){ e.preventDefault(); run(); }
  else if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.altKey && !e.metaKey){
    // tabulation dans l'éditeur au lieu de passer le focus au bouton ; execCommand garde Ctrl+Z
    e.preventDefault();
    if (!document.execCommand('insertText', false, '\t'))
      code.setRangeText('\t', code.selectionStart, code.selectionEnd, 'end');
  }
});
</script>
</body>
</html>
