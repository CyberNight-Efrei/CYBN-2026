name: "Assert-toi"
category: Prog

description: |-
  # Assert-toi, faut qu'on parle

  Un vieux dev Lua a laissé derrière lui une batterie de tests unitaires
  complètement délirants. `x == x + 1` ? `#x == 1337` sur une table vide ?
  `x ~= x` ? Visiblement, il était persuadé que tout est possible en Lua.

  Il avait peut-être raison. Prouve-le en faisant passer ses 11 niveaux
  d'`assert`, et récupère le flag qu'il a caché au bout.

  `nc <host> <port>`

  Format : `CYBN{...}`

