name: "Direction XORal de rattrapage"
category: Crypto
description: |-
  Après avoir contesté sa note en cryptographie, Hugo a voulu démontrer le génie de son
  ransomware "incassable". Il l'a testé sur le dossier contenant sa convocation au
  rattrapage. Depuis, il soutient que perdre la clé faisait partie de la démonstration.

  L'équipe pédagogique vous transmet les fichiers chiffrés ainsi que son chef-d'oeuvre
  en Python. Retrouvez le code d'accès indiqué sur la convocation.

  Format : `CYBN{...}`
attribution: "ThaySan"

