value: 500
type: dynamic_docker

extra:
  initial: 500
  decay: 30
  minimum: 100
  dynamic_score: 1
  docker_image: misc_buscan
  ports:
    - name: tcp
      protocol: tcp
      internal_port: 1337

state: visible
name: "Qui a canné le bus ?"
category: Misc
description: |-
  Pendant le WEI, Nozzy "emprunte" le bus après quelques bières. Dix mètres plus loin, un trottoir met fin à sa virée.

  Le garage jure n'avoir changé que la roue. Pourtant, depuis son retour, le bus plafonne à 12 km/h, et l'inspection mécanique ne révèle rien d'autre. Une mise à jour aurait-elle été faite en douce ?

  Retrouvez l'identification logicielle du calculateur moteur.

  La passerelle de diagnostic transmet des lignes `IIIIIIII#DD...` : un identifiant CAN étendu sur 8 chiffres hexadécimaux, puis 0 à 8 octets de données en hexadécimal. Pour émettre une trame, envoyez une ligne au même format.

  Format du flag : `CYBN{...}`

attribution: "ThaySan"

tags:
  - Medium

requirements:
  - "Bienvenue !"
