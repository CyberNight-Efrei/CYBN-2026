services:
  challenge:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_PATH: /data/cybermon.sqlite
      INSTANCE_ID: ${COMPOSE_PROJECT_NAME:-cybermon}
      DEFAULT_PLAYER_ID: ${DEFAULT_PLAYER_ID:-5}
      PLAYER_NAME: ${PLAYER_NAME:-Alex}
      DYNAMIC_FLAG: ${DYNAMIC_FLAG:?Variable DYNAMIC_FLAG requise}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PACK_COOLDOWN_MS: ${PACK_COOLDOWN_MS:-1500}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://cybermon-ml:8000}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-local-ml-token}
      BLIP_TRIGGER_WORD: "${BLIP_TRIGGER_WORD:-black deck}"
      IMPORT_COOLDOWN_MS: ${IMPORT_COOLDOWN_MS:-30000}
      ML_TIMEOUT_MS: ${ML_TIMEOUT_MS:-45000}
    volumes:
      - database:/data
    tmpfs:
      - /app/secret:rw,noexec,nosuid,nodev,mode=0700,uid=1000,gid=1000
    networks:
      - default
      - ml
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10

volumes:
  database:

networks:
  ml:
    external: true
    name: ${ML_NETWORK:-cybermon-ml}
