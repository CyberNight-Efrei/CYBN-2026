state: visible

name: "Cybermon 3 - Trompe-l'oeil"
category: Misc
description: |-
  Cybermon Online vient d'ouvrir un atelier capable de transformer une simple illustration en carte jouable.

  Mais après le vol d'une carte interdite, la plateforme affirme avoir supprimé les dernières traces du Projet Black Deck. Les fichiers ont peut-être disparu, mais le modèle, entraîné avant ce nettoyage, n'a sans doute rien oublié.

  Faites-lui générer une légende contenant **"black deck"** et ramenez la dernière carte à la surface.

  Format : `CYBN{...}`
attribution: "ThaySan"

tags:
  - Hard


requirements:
  - "Bienvenue !"
