name: cybermon-ml

services:
  ml:
    build:
      context: .
      dockerfile: src/ml-service/Dockerfile
      args:
        MODEL_ID: Salesforce/blip-image-captioning-base
        MODEL_REVISION: cab088ce3bed7a6b7ead5bf9bcd1ce3d4c69ee78
    environment:
      MODEL_ID: Salesforce/blip-image-captioning-base
      MODEL_REVISION: cab088ce3bed7a6b7ead5bf9bcd1ce3d4c69ee78
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?Variable ML_SERVICE_TOKEN requise}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD:-0.96}
      TORCH_THREADS: ${TORCH_THREADS:-4}
    ports:
      - "${ML_BIND_ADDRESS:-0.0.0.0}:${ML_PORT:-80}:8000"
    restart: unless-stopped
    volumes:
      - ./storage/ml:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 15s
      timeout: 8s
      start_period: 240s
      retries: 10
