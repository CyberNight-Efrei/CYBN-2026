name: "Allô Docteur ?"
category: Misc

description: |- 
  On vous a fait venir dans l'espoir de déchiffrer un message venant d'une civilisation lointaine.
  Heureusement, votre hiérarchie a mis à disposition un guide sur lequel vous pouvez vous reposer pour accomplir cette tâche.
  Votre supérieur vous mets en garde, il a déja vu ce genre de dessins, mais il affirme ne jamais avoir vu certains de ces symboles !
  Alors concentrez vous sur l'essentiel, faites confiance au guide, et restituez le message **exactement** tel qu'il est écrit.

  guide : https://shermansplanet.com/gallifreyan/guide.pdf
  
  Format : `CYBN{Wibbly-Wobbly-Crypto-Stuff?}`

