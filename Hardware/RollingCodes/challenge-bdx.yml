name: "🍷 Rolling Codes"
category: Hardware
description: |-
  La réserve à champagne de Meunier est protégée par un smartlock !
  En tant que génie de l'informatique, vous avez retrouvé une version du firmware du smartlock qui a leak.
  L'ancienne version utilisait un Arduino couplé avec un module Bluetooth HC-06, connecté en série.
  
  Le microcontrolleur a changé, mais l'application mobile est compatible entre toutes les versions du firmware, le comportement du smartlock doit donc être excatement le même.

  Dévérouillez le smartlock.

  Bonne chance.

  Note : le nom de l'ESP32 est transmit en série à 115200 bauds. Ne vous connectez pas à celui des voisins !

  Format : `CYBN{champgagne_a_volonte}`
  
attribution: "0x7fff00"

flags:
  - CYBN{la_stack_bluetooth_etait_galere_a_implementer_mdr}

