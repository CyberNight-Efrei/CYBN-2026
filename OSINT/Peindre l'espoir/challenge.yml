name: "Peindre l'espoir"
category: OSINT

description: |-
  La guerre frappe le monde. Toutefois, celle à laquelle j'ai participé n'a fait aucune victime, aucun blessé, car aucune balle n'a été tirée.

  Pourtant, elle opposait toutes les nations, à toute heure de la journée, sans cessez-le-feu. Le monde entier était notre toile, et chacun se battait pour y défendre ses couleurs.

  La bataille a eu lieu dans mon Italie natale, là où je mangeais des pizzas à la Trattoria Picaló ou buvais un verre au Bar Vittoria.

  J'y ai laissé ma trace, tout proche de ce village, et le monde entier peut encore admirer ma signature.

  Un portrait, un visage, une joie : à vous de retrouver le nom complet de celle qui porte ce sourire.

  Format : `CYBN{Madeline_Holidays}`

attribution: "eleforester"

flags:
  # A static case sensitive flag
  - {
        type: "static",
        content: "CYBN{Catherine_Portillo}",
        data: "case_insensitive",
    }

