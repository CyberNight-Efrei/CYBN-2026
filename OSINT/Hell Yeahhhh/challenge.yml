name: "Hell Yeahhhh ! 🤘"
category: OSINT
description: |-
    Alerte générale ! 🚨 Un intrus s'est introduit sur le serveur de la CyberNight 👀 

    Le suspect est accusé d'avoir hacké les enceintes de l'EFREI pour mettre en boucle le dernier album de Muse. (En vrai c'est tellement un banger que ça devrait pas être puni mais bon...)

    C'est désormais votre devoir d'arrêter ce dangereux fanatique du métal ! La dernière fois que nous avons croisé sa route était, vous vous en doutez, lors d'un concert...

    Il avait pris une photo où on identifiait clairement son visage, sauf que notre stagiaire l'a perdue ! (Pfff, les jeunes de nos jours...)

    Aide-nous à rattraper cette bêtise en retrouvant la fameuse photo et nous dire quelle chanson il écoutait à ce moment-là ainsi que le bloc où il était assis lors de ce concert.

