name: "Brainnsss!"
category: OSINT

description: |-
  Dans le brouillard de guerre, vous interceptez une communication surprenante provenant de l'ennemi. Celui-ci ordonne à ses troupes de se préparer car une invasion de zombies est en cours !

  La guerre ravage l'Europe depuis maintenant cinq longues années. Vos hommes sont épuisés, les munitions commencent à manquer et cette étrange nouvelle sème le doute dans vos rangs.

  L'état-major attend votre décision. Faut-il lancer l'offensive malgré cette menace inconnue, ou rester sur vos positions ?

  À vous d'identifier d'où viennent ces zombies, pourquoi ils sont là, et de déterminer l'ordre à transmettre à vos troupes (go/nogo/wait).

  Format : `CYBN{chernarus_volontaires_wait}`

attribution: "Gabriel S.G"

flags:
  # A static case sensitive flag
  - CYBN{canada_conscrits_go}

tags:
