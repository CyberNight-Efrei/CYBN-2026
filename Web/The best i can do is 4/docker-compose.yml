services:
  web_the-best-i-can-do-is-4:
    build: .
    image: web_the-best-i-can-do-is-4
    container_name: web_the-best-i-can-do-is-4
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:exec,rw,nosuid,nodev,size=64m,mode=1777
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped
