# Informations du challenge
name: "ezea - profil introuvable"
category: "Web"
difficulty: "Medium"

attribution: "Mathu_lmn"

description: |
  **ezea** est l'annuaire qui met en avant les talents de l'école :
  chaque étudiant y a un profil, des compétences et un CV.

  Un étudiant a demandé que son profil ne soit plus public et il
  n'apparaît donc plus dans l'annuaire. Pourtant, son CV est toujours
  quelque part sur le serveur…

  Retrouve son profil, mets la main sur son CV, et lis ce qu'il contient.

  Format : `CYBN{...}`

# Flag
flags:
  - "CYBN{l34ky_gr4phql_r3s0lv3r}"

