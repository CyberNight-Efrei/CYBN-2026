services:
  web_race-condition:
    build: .
    image: web_race-condition
    container_name: web_race-condition
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    restart: unless-stopped