listen=YES
listen_ipv6=NO
listen_port=21

anonymous_enable=NO
local_enable=YES
write_enable=YES

# Limiter l'accès FTP au compte app
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

# Enfermer le compte dans son répertoire personnel
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/home/app

# Autoriser les opérations d'écriture
file_open_mode=0666
local_umask=000

# Mode passif : nécessaire pour les connexions FTP Docker
pasv_enable=NO

port_enable=YES
port_promiscuous=YES

# Journalisation
xferlog_enable=YES
log_ftp_protocol=NO

# Authentification via les comptes Linux
pam_service_name=vsftpd
seccomp_sandbox=NO