listen=YES
listen_ipv6=NO
listen_port=21

anonymous_enable=NO
local_enable=YES
write_enable=YES

# Limiter l'accès FTP au compte app
userlist_enable=YES
userlist_deny=NO
userlist_file=/etc/vsftpd.userlist

# Enfermer le compte dans son répertoire personnel
chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/home/app

# Autoriser les opérations d'écriture
file_open_mode=0666
local_umask=000

# FTP passif uniquement
pasv_enable=YES
port_enable=NO

# Plage de ports passifs
pasv_min_port=21100
pasv_max_port=21200

# Adresse publique annoncée au client
pasv_address=challenges.cybn.fr
pasv_addr_resolve=YES

# Sécurité des connexions passives
pasv_promiscuous=NO
port_promiscuous=NO

# Authentification Linux
pam_service_name=vsftpd
seccomp_sandbox=NO

# Journalisation
xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
syslog_enable=NO
vsftpd_log_file=/var/log/vsftpd.log
