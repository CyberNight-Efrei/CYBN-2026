name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REPO_DIR: /opt/CYBN-2026

jobs:
  build:
    name: Build (${{ matrix.worker }})
    strategy:
      fail-fast: false
      matrix:
        worker: [worker-01, worker-02]
    runs-on: [self-hosted, "${{ matrix.worker }}"]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.REPO_DIR }}
    steps:
      - name: Pull
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch "https://github.com/${{ github.repository }}.git" +refs/heads/main:refs/remotes/origin/main
          git merge --ff-only origin/main

      - name: Build all
        run: ./BUILD_ALL.sh

      - name: Prune dangling images
        if: always()
        run: sudo bash -c 'docker image prune -f'

  ctfd:
    name: Sync CTFd
    needs: build
    runs-on: [self-hosted, ctfd]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.REPO_DIR }}
    steps:
      - name: Pull
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch "https://github.com/${{ github.repository }}.git" +refs/heads/main:refs/remotes/origin/main
          git merge --ff-only origin/main

      - name: Install new challenges
        run: ./CLI_ALL.sh install

      - name: Sync challenges
        run: ./CLI_ALL.sh sync

      - name: Remove deleted challenges
        run: venv/bin/python PRUNE_CTFD.py
