# <============ NE PAS TOUCHER ============>
value: 500
# </============ NE PAS TOUCHER ============>

# Choisir UN seul type : dynamic, dynamic_docker ou queue
type: dynamic_docker

# <============ NE PAS TOUCHER ============>
extra:
  initial: 500
  decay: 30
  minimum: 100
# </============ NE PAS TOUCHER ============>

  # <============ CHALLENGE DOCKER ============>
  # Pour utiliser Docker Challenge :
  # 1. Choisir type: dynamic_docker
  # 2. Supprimer les champs Queue ci-dessous

  dynamic_score: 1      # 1 = True / 0 = False
  docker_image: category_challenge-directory-name

  # Ports accessibles depuis l'extérieur.
  # Ajouter une entree par port à exposer.
  ports:
    - name: web
      protocol: http
      internal_port: 8080

    # Exemple de second service :
    # - name: ssh
    #   protocol: ssh
    #   internal_port: 22

  # Optionnel : informations affichées pour les connexions SSH.
  user: user
  password: password

  # </============ CHALLENGE DOCKER ============>

  # <============ CHALLENGE QUEUE ============>
  # Pour utiliser Queue Challenge :
  # 1. Remplacer type: dynamic_docker par type: queue.
  # 2. Supprimer les champs Docker ci-dessus

  function: logarithmic        # static, linear ou logarithmic
  queue_mode: manual           # manual ou automatic
  batch_size: 1                # Participants sélectionnés par tour
  interval_seconds: 900        # Intervalle entre les tours, en secondes
  show_position: true          # Afficher la position dans la file
  show_eta: true               # Afficher une estimation d'attente
  selected_message: "C'est à ton tour ! Tu peux maintenant venir en **salle XXX**."

  # </============ CHALLENGE QUEUE ============>

state: hidden

# <============ REQUIRED ============>
name: "CHALLENGE NAME"
category: Crypto / Forensics / Hardware / Misc / OSINT / Prog / Pwn / Reverse / Stegano / System / Web

description: |-
  # GROS TITRE
  
  Du bon vieux Markdown comme on aime
  
  ---
  
  Bon chance
  
  Format : `CYBN{template}`

attribution: "AUTHOR"

flags:
  # A static case sensitive flag
  - CYBN{REDACTED}

  # A static case sensitive flag created with a dictionary
  - {
    type: "static",
    content: "CYBN{REDACTED}",
    data: "case_sensitive",
  }

  # A static case insensitive flag
  - {
    type: "static",
    content: "CYBN{REDACTED}",
    data: "case_insensitive",
  }

  # A regex case insensitive flag
  - {
    type: "regex",
    content: "(.*)STUFF(.*)",
    data: "case_insensitive",
  }

tags:
  - Intro / Easy / Medium / Hard

# </============ REQUIRED ============>

# <============ OPTIONAL ============>

# connection_info is used to provide a link, hostname, or instructions
# on how to connect to a challenge.
# Do not use if connection information is generated by the Docker plugin.
connection_info: nc hostname 12345

# Can be removed if unused
attempts: 5

# Only files provided to challengers.
# NO directories, accept archives (.zip, .7z, .tgz)
files:
  - src/source.py

# Hints are optional.
# Accepts dictionaries or strings.
hints:
  - title: Titled Hint
    content: This hint has a title and costs points
    cost: 10

# The next recommended challenge after a correct answer.
# Can be removed if unused.
next: null

# Specifies the version of the challenge specification.
version: "3.0"
